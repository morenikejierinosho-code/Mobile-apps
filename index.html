<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trivia Crack Mobile Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Status Navigation Bar -->
    <header class="app-bar">
        <div class="crowns-container">
            <span id="crown-art" class="crown disabled">🎨</span>
            <span id="crown-history" class="crown disabled">📜</span>
            <span id="crown-science" class="crown disabled">🔬</span>
            <span id="crown-sports" class="crown disabled">⚽</span>
            <span id="crown-geography" class="crown disabled">🌍</span>
            <span id="crown-entertainment" class="crown disabled">🎬</span>
        </div>
        <button id="settings-btn" class="icon-btn">⚙️</button>
    </header>

    <!-- Main Game Window Target Screens -->
    <main class="game-container">
        
        <!-- SCREEN 1: Interactive Random Category Selection Wheel -->
        <section id="wheel-screen" class="screen">
            <div class="wheel-box">
                <div class="wheel-pointer">👇</div>
                <div id="trivia-wheel" class="wheel">
                    <div class="sector art"><span>🎨</span></div>
                    <div class="sector entertainment"><span>🎬</span></div>
                    <div class="sector geography"><span>🌍</span></div>
                    <div class="sector sports"><span>⚽</span></div>
                    <div class="sector science"><span>🔬</span></div>
                    <div class="sector history"><span>📜</span></div>
                </div>
            </div>
            <button id="spin-btn" class="primary-btn">SPIN WHEEL</button>
            <h2 id="wheel-status">Spin to choose a category!</h2>
        </section>

        <!-- SCREEN 2: Active Challenge Card View -->
        <section id="quiz-screen" class="screen hidden">
            <div class="card">
                <div id="category-badge" class="badge">Category</div>
                <h2 id="question-text">Loading question content...</h2>
                <div id="answer-options" class="options-grid"></div>
                <button id="next-btn" class="primary-btn hidden">Continue</button>
            </div>
        </section>

        <!-- SCREEN 3: End of Game Victory View -->
        <section id="victory-screen" class="screen hidden">
            <div class="card victory-card">
                <h2>🏆 Victory! 🏆</h2>
                <p>Amazing job! You collected all 6 category crowns and conquered the game!</p>
                <button id="play-again-btn" class="primary-btn">Play Again</button>
            </div>
        </section>
    </main>

    <!-- Sliding Side Options Menu Drawer -->
    <div id="settings-panel" class="settings-drawer">
        <div class="drawer-header">
            <h3>Game Options</h3>
            <button id="close-settings" class="icon-btn">❌</button>
        </div>
        <div class="drawer-content">
            <div class="setting-item">
                <label for="dark-mode-toggle">Dark Theme Mode</label>
                <input type="checkbox" id="dark-mode-toggle">
            </div>
            <hr class="divider">
            <div class="setting-item">
                <button id="reset-game-btn" class="danger-btn">Reset All Progress</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
