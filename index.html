<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz & Trivia App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">

        <section id="home-screen" class="screen">
            <div style="font-size: 4.5rem; margin: 40px 0 10px 0;"></div> <h2>Quiz & Trivia App</h2>
            <div style="margin-top: auto; width: 100%;">
                <button id="start-game-btn" class="start-btn">START GAME</button>
                <button class="settings-btn">SETTINGS</button>
            </div>
        </section>

        <section id="level-screen" class="screen hidden">
            <div class="top-bar">
                <button id="level-back-btn" class="back-btn">&lt; Back</button> <span>Quiz Options</span>
            </div>
            <h2>SELECT A LEVEL</h2>
            <div style="margin-top: 20px; width: 100%;">
                <button class="answer-btn level-select-btn" data-level="1" style="text-align: center;">LEVEL 1: General Knowledge</button>
                <button class="answer-btn level-select-btn" data-level="2" style="text-align: center;">LEVEL 2: Science</button>
                <button class="answer-btn level-select-btn" data-level="3" style="text-align: center;">LEVEL 3: Sports</button>
            </div>
        </section>

        <section id="quiz-screen" class="screen hidden">
            <div class="top-bar">
                <span id="live-score">Score: 0</span>
                <span id="progress-marker">Question 1 of 10</span> </div>
            
            <h3 id="question-text" style="margin: 30px 0; min-height: 60px;">Loading Question...</h3>
            
            <div class="answers-grid">
                <button class="answer-btn" data-choice="A">A. </button>
                <button class="answer-btn" data-choice="B">B. </button>
                <button class="answer-btn" data-choice="C">C. </button>
                <button class="answer-btn" data-choice="D">D. </button>
            </div>
            
            <button id="next-question-btn" class="next-btn" disabled>NEXT &gt;</button>
        </section>

        <section id="results-screen" class="screen hidden">
            <h2 style="margin-top: 30px;">QUIZ COMPLETE!</h2>
            <p style="font-family: 'Poppins'; margin-bottom: 0;">Your Score:</p>
            <div id="final-score-display" class="massive-text">0 Points</div>
            
            <div style="margin-top: auto; width: 100%;">
                <button id="play-again-btn" class="start-btn">PLAY AGAIN</button>
                <button id="go-to-feedback-btn" class="settings-btn" style="background-color: #ffffff; color: #4A00E0;">FEEDBACK</button>
            </div>
        </section>

        <section id="feedback-screen" class="screen hidden">
            <div class="top-bar">
                <button id="feedback-home-btn" class="back-btn">&lt; Home</button>
                <span>GIVE FEEDBACK</span>
            </div>
            
            <form id="feedback-form">
                <label for="form-name">Your Name:</label>
                <input type="text" id="form-name" required placeholder="Enter your name..."> <label>Rating:</label>
                <div class="star-rating" id="star-container">
                    <span class="star" data-rating="1">★</span>
                    <span class="star" data-rating="2">★</span>
                    <span class="star" data-rating="3">★</span>
                    <span class="star" data-rating="4">★</span>
                    <span class="star" data-rating="5">★</span>
                </div>
                
                <label for="form-comments">Comments:</label>
                <textarea id="form-comments" rows="3" required placeholder="Write your comments here..."></textarea>
                
                <button type="submit" class="submit-btn" style="margin-top: 10px;">SUBMIT</button>
            </form>
        </section>

    </div>

    <script src="script.js"></script>
</body>
</html>
